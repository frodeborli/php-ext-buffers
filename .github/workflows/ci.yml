name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Every job builds the extension and tests/api-consumer (an extension that uses only php_buffers_api.h)
# with tools/build.sh, then runs the phpt suite twice with tools/run-phpt.sh: with buffers alone, and
# with the API consumer loaded as well.
jobs:
  build-test:
    name: PHP ${{ matrix.php }} ${{ matrix.libc }}
    runs-on: ubuntu-latest
    # The official images have phpize and php-config; Debian 12 is glibc, Alpine is musl.
    container: php:${{ matrix.php }}-cli${{ matrix.libc == 'musl' && '-alpine' || '-bookworm' }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        libc: [glibc, musl]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          if command -v apk >/dev/null; then apk add --no-cache $PHPIZE_DEPS >/dev/null
          else apt-get update -q && apt-get install -y -q --no-install-recommends $PHPIZE_DEPS >/dev/null; fi
      - name: Build (-Wall -Wextra, test helpers on; fails on any warning)
        run: tools/build.sh "$PWD" /tmp/build "$(command -v phpize)" "$(command -v php-config)"
      - name: Test
        run: tools/run-phpt.sh "$(command -v php)" /tmp/build -P

  zts:
    name: PHP ${{ matrix.php }} ZTS
    runs-on: ubuntu-latest
    container: php:${{ matrix.php }}-zts-bookworm
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: apt-get update -q && apt-get install -y -q --no-install-recommends $PHPIZE_DEPS >/dev/null
      - run: tools/build.sh "$PWD" /tmp/build "$(command -v phpize)" "$(command -v php-config)"
      - run: tools/run-phpt.sh "$(command -v php)" /tmp/build -P

  i386:
    name: PHP 8.4 32-bit (linux/386)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: DOCKER_PLATFORM=linux/386 tools/docker-test.sh php:8.4-cli-bookworm

  valgrind:
    name: valgrind (USE_ZEND_ALLOC=0)
    runs-on: ubuntu-latest
    container: php:8.4-cli-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: apt-get update -q && apt-get install -y -q --no-install-recommends $PHPIZE_DEPS valgrind >/dev/null
      - run: tools/valgrind.sh

  oracle:
    name: NumPy / ml_dtypes oracles (decode, doubles, NumPy differential fuzz, view() fuzz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with: { php-version: '8.4', tools: phpize, coverage: none }
      - run: pip install numpy ml_dtypes==0.5.4
      - run: tools/oracle/run.sh decode && tools/oracle/run.sh doubles
      - name: Build
        run: phpize && ./configure --enable-buffers CFLAGS="-O2" && make -j"$(nproc)"
      - run: tools/oracle/run-fuzz.sh 3000 1 "$PWD/modules/buffers.so"
      - run: SCRIPT=view_fuzz.py tools/oracle/run-fuzz.sh 20000 1 "$PWD/modules/buffers.so"
      # the exhaustive float32 sweep (all 2^32 inputs per format) takes minutes per format: tools/oracle/run.sh encode
