name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: PHP ${{ matrix.php }} ${{ matrix.libc }}
    runs-on: ubuntu-latest
    # The official images have phpize and php-config; Debian 12 is glibc, Alpine is musl.
    container: php:${{ matrix.php }}-cli${{ matrix.libc == 'musl' && '-alpine' || '-bookworm' }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        libc: [glibc, musl]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          if command -v apk >/dev/null; then apk add --no-cache $PHPIZE_DEPS >/dev/null
          else apt-get update -q && apt-get install -y -q --no-install-recommends $PHPIZE_DEPS >/dev/null; fi
      - name: Build (-Wall -Wextra, test helpers on)
        run: |
          phpize
          ./configure --enable-dlpack --enable-dlpack-testing CFLAGS="-g -O2 -Wall -Wextra -Wno-unused-parameter -Wno-missing-field-initializers"
          make -j"$(nproc)" 2>&1 | tee build.log
          ! grep -E "warning:|error:" build.log
      - name: Test
        env: { NO_INTERACTION: '1', REPORT_EXIT_STATUS: '1', TEST_PHP_ARGS: '--show-diff' }
        run: make test TESTS=tests/

  zts:
    name: PHP ${{ matrix.php }} ZTS
    runs-on: ubuntu-latest
    container: php:${{ matrix.php }}-zts-bookworm
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: apt-get update -q && apt-get install -y -q --no-install-recommends $PHPIZE_DEPS >/dev/null
      - run: phpize && ./configure --enable-dlpack --enable-dlpack-testing CFLAGS="-g -O2" && make -j"$(nproc)"
      - env: { NO_INTERACTION: '1', REPORT_EXIT_STATUS: '1', TEST_PHP_ARGS: '--show-diff' }
        run: make test TESTS=tests/

  valgrind:
    name: valgrind (USE_ZEND_ALLOC=0)
    runs-on: ubuntu-latest
    container: php:8.4-cli-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: apt-get update -q && apt-get install -y -q --no-install-recommends $PHPIZE_DEPS valgrind >/dev/null
      - run: phpize && ./configure --enable-dlpack --enable-dlpack-testing CFLAGS="-g -O1" && make -j"$(nproc)"
      - run: tools/valgrind.sh

  oracle:
    name: ml_dtypes oracle (decode of every code, encode of random doubles and midpoints)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pip install numpy ml_dtypes==0.5.4
      - run: tools/oracle/run.sh decode && tools/oracle/run.sh doubles
      # the exhaustive float32 sweep (all 2^32 inputs per format) takes minutes per format: tools/oracle/run.sh encode
